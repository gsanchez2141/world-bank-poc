name: world-bank

services:
  dbt-postgres:
    build:
      context: .
      dockerfile: images/dbt-postgres/Dockerfile
    image: dbt-postgres
    profiles: ["manual"]
    network_mode: service:aws-emulator
    environment:
      WORLD_BANK_ALERT_TOPIC_ARN: ${WORLD_BANK_ALERT_TOPIC_ARN:-}
    volumes:
      - ${HOME}/.aws/emulator/9297:/opt/emulator:ro
      - ${WORLD_BANK_EXPORTS_HOST_DIR:-${PWD}/exports}:/exports

  iceberg-spike:
    build:
      context: ./spikes/iceberg
    image: iceberg-spike
    profiles: ["manual"]
    network_mode: service:aws-emulator
    volumes:
      - ${HOME}/.aws/emulator/9297:/opt/emulator:ro
      - ./spikes/iceberg/scd2.sql:/opt/spike/scd2.sql:ro

  lakehouse-ingest-world-bank:
    build:
      context: .
      dockerfile: images/ingest-world-bank/Dockerfile
    image: lakehouse-ingest-world-bank
    profiles: ["manual"]
    network_mode: service:aws-emulator
    environment:
      WORLD_BANK_ALERT_TOPIC_ARN: ${WORLD_BANK_ALERT_TOPIC_ARN:-}
    volumes:
      - ${HOME}/.aws/emulator/9297:/opt/emulator:ro

  lakehouse-stage-world-bank:
    build:
      context: .
      dockerfile: images/stage-world-bank/Dockerfile
    image: lakehouse-stage-world-bank
    profiles: ["manual"]
    network_mode: service:aws-emulator
    environment:
      WORLD_BANK_ALERT_TOPIC_ARN: ${WORLD_BANK_ALERT_TOPIC_ARN:-}
    volumes:
      - ${HOME}/.aws/emulator/9297:/opt/emulator:ro

  lakehouse-consumer-postgres:
    build:
      context: .
      dockerfile: images/consumer-postgres/Dockerfile
    image: lakehouse-consumer-postgres
    profiles: ["manual"]
    network_mode: service:aws-emulator
    environment:
      WORLD_BANK_ALERT_TOPIC_ARN: ${WORLD_BANK_ALERT_TOPIC_ARN:-}
    volumes:
      - ${HOME}/.aws/emulator/9297:/opt/emulator:ro
